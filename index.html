<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Note Chunker</title>
  <!-- styles -->
  <link rel="stylesheet" href="styles/style.css"></link>
</head>
<body>
  <main class="app">  
    <!-- HEADER -->
    <header class="app-header">
      <h1>Learning Note Chunker</h1>
      <p>Split long learning notes into manageable sequential chunks — perfect for copying into an AI conversation.</p>
    </header>

    <!-- INPUT AREA -->
    <section class="input-section" aria-label="Input your learning notes">
      <div class="input-label">
        <span>Your notes</span>
        <span class="word-hint">Maximum: approximately 4000 words</span>
      </div>
      <textarea
        class="note-textarea"
        placeholder="Paste or type your long learning notes here…"
        aria-label="Learning notes textarea"
      ></textarea>
      <button class="split-btn" type="button">
        <span aria-hidden="true">✂️</span> Split Notes
      </button>
    </section>

    <!-- CHUNK RESULTS (DEMO) -->
    <section class="results-section" aria-label="Chunk results preview">
      <h2 class="results-title">Chunks</h2>
      <p class="results-sub">Your original text is preserved and shown in order. Each chunk can be copied individually.</p>

      <!--results -->
      <section class="results">
      </section>
    </section>
  </main>

  <!-- Modal Overlay -->
  <div id="myModal" class="modal-overlay">
      <!-- Modal Box -->
      <div class="modal-box">
          <!-- Header -->
          <div class="modal-header">
              <h2 class="modal-heading">Modal Header</h2>
              <button id="closeModalBtn" class="close-btn">&times;</button>
          </div>

          <!-- Scrollable Body Content -->
          <div class="modal-body">
              <!--<p>This is the start of the scrollable content...</p>-->
              <!-- Simulating long content -->
              <!-- <div
                      style="height: 600px; background: linear-gradient(#eee, #ccc); margin: 15px 0; padding: 10px; border-radius: 4px;">
                      [Long content area - scroll down to see the footer]
                  </div> -->
              <!-- <p>This is the end of the scrollable content.</p> -->
          </div>

          <!-- Footer -->
          <!-- <div class="modal-footer">
                  <button id="footerCloseBtn">Close</button>
              </div> -->
      </div>
  </div>

  <!-- JavaScript -->
  <script src="scripts/script.js"></script>
</body>
</html>
